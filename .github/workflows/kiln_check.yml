# Reusable workflow. Checks the source key and every native and model URL
# of a kiln package (`dart run <package>:check`), and that the files pub
# publishes compute that key. The caller sets the
# triggers: the pull requests that change the manifests, and a daily
# schedule.
name: Kiln check

on:
  workflow_call:
    inputs:
      package:
        description: The Dart package of kiln. native_prebuilt before its rename.
        type: string
        default: kiln
      working-directory:
        description: The directory of the package in the repository.
        type: string
        default: .

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@6aa0bb47914b8fdc5e80f0452b274d3d9e4ac260 # self
      - run: flutter pub get --no-example
      - name: Check the source key and every native and model URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: dart run "$PACKAGE:check"
      # The check above hashes the files that git tracks. pub publishes
      # fewer (a tracked file that a .gitignore ignores): an app would then
      # compute another key and reject the package.
      - uses: Telosnex/telosnex_ci_tools/actions/published-key@6aa0bb47914b8fdc5e80f0452b274d3d9e4ac260 # self
        with:
          package: ${{ inputs.package }}
          working-directory: ${{ inputs.working-directory }}
