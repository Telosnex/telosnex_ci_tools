# Reusable workflow. Checks the source key and every native and model URL
# of a kiln package (`dart run <package>:check`). The caller sets the
# triggers: the pull requests that change the manifests, and a daily
# schedule.
name: Kiln check

on:
  workflow_call:
    inputs:
      package:
        description: The Dart package of kiln. native_prebuilt before its rename.
        type: string
        default: kiln

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@28f952341c98ce5cdfcd1e80854177bd5de9dd4e # self
      - run: flutter pub get --no-example
      - name: Check the source key and every native and model URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: dart run "$PACKAGE:check"
