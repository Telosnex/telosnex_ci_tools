# Reusable workflow. Checks the source key and every native and model URL
# of a package (`dart run <package>:check`). The caller
# sets the triggers, usually the pull requests that change the manifest and a
# daily schedule.
name: Kiln check

on:
  workflow_call:
    inputs:
      package:
        description: The Dart package of kiln. native_prebuilt before its rename.
        type: string
        default: kiln
      flutter-version:
        description: Empty for the version of setup-flutter.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@ce91931cfe0ac0c2f7fc2cbe267ab03f0b33acd9 # self
        with:
          version: ${{ inputs.flutter-version }}
      - run: flutter pub get --no-example
      - name: Check the source key and every native and model URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
        run: dart run "$PACKAGE:check"
