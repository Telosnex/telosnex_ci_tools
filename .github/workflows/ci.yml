name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pin_self --check compares the pinned commit with HEAD.
          fetch-depth: 0
      - uses: ./actions/setup-flutter
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Lint the workflows
        run: dart run telosnex_ci_tools:lint .
      - name: Check the self references
        run: dart run telosnex_ci_tools:pin_self --check
      - name: actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The action on its runner: the C++ test program with the NDK's file
  # names, run with the action's adb; the exit codes come through.
  android-arm64-chroot:
    name: Android ARM64 chroot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-flutter
      - uses: ./actions/android-arm64-chroot
      - name: Build, push and run
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          libcxx="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          "$bin/aarch64-linux-android24-clang++" -std=c++17 -O2 -Wall -Werror \
            test/fixtures/android_arm64_chroot.cc -o "$RUNNER_TEMP/program"
          [[ "$(adb get-state)" == device ]]
          [[ "$(adb shell getprop ro.product.cpu.abi)" == arm64-v8a ]]
          adb shell 'rm -rf /data/local/tmp/t && mkdir /data/local/tmp/t'
          adb push "$RUNNER_TEMP/program" "$libcxx" /data/local/tmp/t/
          out=$(adb shell 'cd /data/local/tmp/t && LD_LIBRARY_PATH=. ./program' 2>&1)
          echo "$out"
          [[ "$out" == 'arm64 chroot: 0 args, sqrt(2)=1.414214' ]]
          rc=0
          adb shell 'cd /data/local/tmp/t && LD_LIBRARY_PATH=. ./program 7' || rc=$?
          [[ "$rc" == 7 ]] || { echo "::error::adb shell gave exit code $rc, not 7."; exit 1; }
          adb pull /data/local/tmp/t/program "$RUNNER_TEMP/pulled"
          cmp "$RUNNER_TEMP/program" "$RUNNER_TEMP/pulled"

  # actions/android-test-apks and actions/android-arm64-container together:
  # a new Flutter app with the fixture test files, built on x64 and run on
  # arm64. The passing file passes, and the failing one fails the run.
  test-apks:
    name: Test APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-flutter
      - name: Create the fixture app
        run: |
          flutter create --org dev.telosnex --platforms android --project-name fixture build/fixture
          cd build/fixture
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}'
          mkdir integration_test
          cp ../../test/fixtures/android_test_apks/*.dart integration_test/
          # The action reads the Gradle wrapper files that Git lists.
          git add --intent-to-add -f android/gradle/wrapper/gradle-wrapper.properties
      - uses: ./actions/android-test-apks
        with:
          working-directory: build/fixture
          targets: |
            integration_test/pass.dart
            integration_test/fail.dart
          gradle-wrappers: build/fixture/android/gradle/wrapper/gradle-wrapper.properties

  android-arm64-container:
    name: Android ARM64 container
    needs: test-apks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-flutter
      - uses: ./actions/download-artifact
        with:
          name: android-test-apks
          path: ${{ runner.temp }}/apks
      - name: Split the passing and failing APKs
        run: |
          apks="$RUNNER_TEMP/apks"
          for kind in pass fail; do
            mkdir -p "$apks/$kind"
            grep -P "\tintegration_test/$kind\.dart$" "$apks/apks.tsv" > "$apks/$kind/apks.tsv"
            ln -s "$apks/$(cut -f1 "$apks/$kind/apks.tsv")" "$apks/$kind/"
          done
      - uses: ./actions/android-arm64-container
        with:
          apks: ${{ runner.temp }}/apks/pass
      - name: A failing test fails the run
        run: |
          rc=0
          dart actions/android-arm64-container/run_tests.dart "$RUNNER_TEMP/apks/fail" 2 5 > "$RUNNER_TEMP/fail.txt" || rc=$?
          # The expected failure, not as an annotation.
          sed 's/^::error::/error: /' "$RUNNER_TEMP/fail.txt"
          [[ "$rc" == 1 ]] || { echo "::error::The failing test file gave exit code $rc, not 1."; exit 1; }
          grep -q '^::error::integration_test/fail.dart: 1 passed, 1 failed$' "$RUNNER_TEMP/fail.txt"

  web-test-package:
    name: Package telosnex_web_test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/telosnex_web_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-flutter
      - run: flutter pub get
      - run: (cd fixture && flutter pub get)
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: (cd fixture && flutter analyze --fatal-infos)
      - run: flutter test
      - name: flutter test --platform chrome
        run: |
          flutter test --platform chrome
          flutter test --platform chrome --wasm

  # The package and actions/web-driver together, with the fixture app.
  web-test-fixture:
    name: Web Linux x64 Chrome ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2js, dart2wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-flutter
      - name: Passing run
        uses: ./actions/web-driver
        with:
          browser: chrome
          working-directory: packages/telosnex_web_test/fixture
          artifact-name: web-test-fixture-${{ matrix.compiler }}-pass
          require-result: '.fixture == "pass" and .telosnexWebTestSummary.passed == 3'
          run: |
            flutter pub get
            args=()
            if [[ "${{ matrix.compiler }}" == dart2wasm ]]; then args+=(--wasm); fi
            flutter drive --release -d web-server --browser-name chrome "${args[@]}" \
              --driver test_driver/integration_test.dart \
              --target integration_test/fixture_test.dart
            # Every console line, also those after the last poll.
            grep -q ' info ==== test plain test passes$' "$TELOSNEX_WEB_TEST_CONSOLE"
            grep -q ' log fixture: last line$' "$TELOSNEX_WEB_TEST_CONSOLE"
            lines=$(grep -c ' log fixture: line ' "$TELOSNEX_WEB_TEST_CONSOLE")
            if [[ "$lines" != 6000 ]]; then
              echo "::error::web_console.log has $lines of the 6000 fixture lines."
              exit 1
            fi
      - name: Failing plain test()
        uses: ./actions/web-driver
        with:
          browser: chrome
          port: '4445'
          working-directory: packages/telosnex_web_test/fixture
          artifact-name: web-test-fixture-${{ matrix.compiler }}-fail-plain
          require-result: '.fixture == "fail_plain" and .telosnexWebTestSummary.failed == 1'
          run: |
            args=(--dart-define=FIXTURE_CASE=fail_plain --driver-port 4445)
            if [[ "${{ matrix.compiler }}" == dart2wasm ]]; then args+=(--wasm); fi
            # integrationDriver() would pass this run.
            if flutter drive --release -d web-server --browser-name chrome "${args[@]}" \
              --driver test_driver/integration_test.dart \
              --target integration_test/fixture_test.dart; then
              echo "::error::A failing plain test() passed."
              exit 1
            fi
