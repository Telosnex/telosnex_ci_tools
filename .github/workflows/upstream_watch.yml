# Reusable workflow. Checks the upstream sources of the caller's
# .github/upstream.yaml (lib/src/upstream.dart): new releases or commits of
# the code that the package pins from other projects. It fails when one has
# an update, and GitHub emails a failed scheduled run to whoever last changed
# the caller's workflow file. The caller sets the triggers: a daily schedule,
# and pushes that change .github/upstream.yaml.
name: Upstream watch

on:
  workflow_call:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@5775736bac784eed742ab6b8a3c3ad99e42340c2 # self
      - uses: Telosnex/telosnex_ci_tools/actions/upstream-watch@5775736bac784eed742ab6b8a3c3ad99e42340c2 # self
