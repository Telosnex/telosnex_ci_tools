name: Dashboard

# The status views of the packages in status/packages.yaml:
# - the live dashboard: README.md and dashboard.json on the dashboard branch,
#   one commit that each run replaces
#   (https://github.com/Telosnex/telosnex_ci_tools/tree/dashboard), and the
#   job summary of each run;
# - status/packages.md on main, committed when it changes (a package starts
#   using Kiln or CI tools). Pushes with GITHUB_TOKEN start no workflow.
#
# GitHub turns off the schedule of a public repository after 60 days without
# activity in it; run it by hand to turn it back on.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - status/packages.yaml
      - bin/dashboard.dart
      - lib/src/dashboard*.dart
      - lib/src/job_names.dart
      - .github/workflows/dashboard.yml

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The packages are public repositories: any token reads their runs and
    # jobs. A private one would need a token with actions: read on it.
    permissions:
      # Pushes the dashboard branch, and status/packages.md to main.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-flutter
      - run: dart pub get
      - name: Build the dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dart run telosnex_ci_tools:dashboard --out "$RUNNER_TEMP/dashboard" \
            --packages-md status/packages.md
          cat "$RUNNER_TEMP/dashboard/README.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the dashboard branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/dashboard"
          git init -q -b dashboard
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md dashboard.json
          git commit -q -m "Dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push -q --force "https://github.com/$REPOSITORY.git" dashboard
      - name: Commit status/packages.md
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git diff --quiet -- status/packages.md; then
            echo "status/packages.md is current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "status/packages.md: update" -- status/packages.md
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          # A push to main since checkout: the next run commits it.
          if ! git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            push -q "https://github.com/$REPOSITORY.git" HEAD:main; then
            echo "::warning::main moved; the next run updates status/packages.md."
          fi
