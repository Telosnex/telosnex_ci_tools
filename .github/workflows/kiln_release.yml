# Reusable workflow. Builds the prebuilt files of a kiln package for every
# native target and for the web, and publishes them as a GitHub release (kiln
# ADR 001 D5, D6, D8; ADR 002 D3, D10). On success it pushes the branch
# kiln-manifest/<tag> with the manifest files. Merge that branch to use the
# release.
#
# The caller sets the triggers and passes `dry-run`. A push to the branch
# kiln-release-dry is a dry run too. Only jpohhhh can publish, and only from a
# repository of the Telosnex organization.
#
# A package changes the steps with files in tool/kiln/. Each file is
# optional. The workflow runs each one with `dart run`, in the root of the
# checkout, except prepare.dart:
#
#   prepare.dart    Before each native build. Installs tools. Gets TARGET,
#                   OUT and ANDROID_NDK_HOME. It can write to GITHUB_ENV and
#                   GITHUB_PATH. KILN_TOOLCHAIN_EXTRA goes at the end of the
#                   toolchain description. It runs as a copy outside the
#                   package, so it can import only dart: libraries.
#   build_web.dart  Gets `--out <dir> --toolchain-file <file>`. Writes the web
#                   runtime files to <dir> and a description of its toolchain
#                   to <file>. Without this file the package has no web files.
#   test_web.dart   Tests the web files after `<package>:web install-dev`.
#   release.dart    Replaces `<package>:release`, with the same arguments.
name: Kiln release

on:
  workflow_call:
    inputs:
      targets:
        description: JSON list of the native targets.
        type: string
        default: >-
          ["windows-x64", "windows-arm64", "linux-x64", "linux-arm64",
          "macos-arm64", "ios-arm64-iphoneos", "ios-arm64-iphonesimulator",
          "android-arm", "android-arm64", "android-x64"]
      dry-run:
        description: Build only, upload nothing.
        type: boolean
        default: false
      package:
        description: The Dart package of kiln. native_prebuilt before its rename.
        type: string
        default: kiln
      build-args:
        description: >-
          JSON. A target pattern (`*` matches any text) to a list of more
          arguments for `<package>:build`, for example
          {"*": ["--ios-version", "15"]}. ${NAME} expands to the environment
          variable NAME.
        type: string
        default: '{}'
      input-artifact:
        description: >-
          An artifact of the caller run. Each build job downloads it into
          $OUT/<input-artifact>, so it goes into the release artifacts too.
        type: string
        default: ''
      debug-symbols-path:
        description: >-
          Android builds upload the files at this path as the artifact
          debug-symbols-<target>, for crash symbolication.
        type: string
        default: ''
      web-test-cache-path:
        description: >-
          A path that the web test caches between runs, for example
          downloaded models. The key is the hash of tool/kiln/test_web.dart.
        type: string
        default: ''
      runners:
        description: >-
          JSON. A target to {"runner", "image"}: the target builds on that
          runner, and in the container image if there is one, for example
          {"windows-x64": {"runner": "windows-2025-vs2026"},
          "linux-x64": {"runner": "ubuntu-22.04", "image": "gcc@sha256:..."}}.
        type: string
        default: '{}'
      web-container:
        description: The container image of the web build, for example emsdk.
        type: string
        default: ''

concurrency:
  group: kiln-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NDK_VERSION: 28.2.13676358
  PACKAGE: ${{ inputs.package }}
  WEB_RUNNER: ubuntu-24.04

jobs:
  build:
    name: ${{ matrix.target }}
    # Linux builds use Ubuntu 22.04 for its older glibc.
    runs-on: >-
      ${{ fromJSON(inputs.runners)[matrix.target].runner ||
      matrix.target == 'windows-arm64' && 'windows-11-arm' ||
      startsWith(matrix.target, 'windows-') && 'windows-2022' ||
      matrix.target == 'linux-arm64' && 'ubuntu-22.04-arm' ||
      (startsWith(matrix.target, 'macos-') || startsWith(matrix.target, 'ios-')) && 'macos-15' ||
      'ubuntu-22.04' }}
    # An empty image: no container.
    container:
      image: ${{ fromJSON(inputs.runners)[matrix.target].image || '' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Prepare the container
        if: fromJSON(inputs.runners)[matrix.target].image
        run: &prepare-container |
          # actions/checkout needs git for a work tree; Flutter needs curl,
          # unzip and xz. Debian 11 packages are on archive.debian.org.
          if command -v apt-get > /dev/null; then
            if grep -q '^VERSION_CODENAME=bullseye$' /etc/os-release; then
              printf 'deb http://archive.debian.org/debian %s main\n' bullseye bullseye-updates > /etc/apt/sources.list
              echo 'deb http://archive.debian.org/debian-security bullseye-security main' >> /etc/apt/sources.list
            fi
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              ca-certificates curl git unzip xz-utils > /dev/null
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@ddf3b51feb64064d8d239ceea60d44e266d32387 # self

      # Files go to $RUNNER_TEMP: untracked files in the checkout count in
      # the source key.
      - name: Set paths
        run: echo "OUT=$RUNNER_TEMP/kiln" >> "$GITHUB_ENV"

      - name: Install the Android NDK
        if: startsWith(matrix.target, 'android-')
        run: |
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      # flutter pub get also downloads sky_engine, which dart pub get needs.
      - run: flutter pub get --no-example

      # `dart run` of a package script first runs the build hook of the
      # package, which needs the tools that prepare.dart installs. A copy
      # outside the package runs alone.
      - name: Prepare (tool/kiln/prepare.dart)
        if: hashFiles('tool/kiln/prepare.dart') != ''
        run: |
          cp tool/kiln/prepare.dart "$RUNNER_TEMP/kiln_prepare.dart"
          cd "$RUNNER_TEMP"
          dart kiln_prepare.dart

      - name: Download ${{ inputs.input-artifact }}
        if: inputs.input-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.input-artifact }}
          path: ${{ runner.temp }}/kiln/${{ inputs.input-artifact }}

      - uses: Telosnex/telosnex_ci_tools/actions/check-clean-tree@ddf3b51feb64064d8d239ceea60d44e266d32387 # self

      - name: Source key
        run: |
          mkdir -p "$OUT/key"
          dart run "$PACKAGE:key" --list > "$OUT/key/$TARGET.txt"
          tail -1 "$OUT/key/$TARGET.txt"

      - uses: Telosnex/telosnex_ci_tools/actions/kiln-build@ddf3b51feb64064d8d239ceea60d44e266d32387 # self
        with:
          package: ${{ inputs.package }}
          target: ${{ matrix.target }}
          out: ${{ runner.temp }}/kiln
          ndk-version: ${{ env.NDK_VERSION }}
          build-args: ${{ inputs.build-args }}

      # Like prepare.dart, a copy outside the package.
      - name: Test the build (tool/kiln/test_build.dart)
        if: hashFiles('tool/kiln/test_build.dart') != ''
        run: |
          cp tool/kiln/test_build.dart "$RUNNER_TEMP/kiln_test_build.dart"
          cd "$RUNNER_TEMP"
          dart kiln_test_build.dart

      - uses: Telosnex/telosnex_ci_tools/actions/check-clean-tree@ddf3b51feb64064d8d239ceea60d44e266d32387 # self

      # The unstripped libraries. The kiln-* artifact has only the stripped
      # release copies.
      - name: Save the Android debug symbols
        if: startsWith(matrix.target, 'android-') && inputs.debug-symbols-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ matrix.target }}
          path: ${{ inputs.debug-symbols-path }}
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiln-${{ matrix.target }}
          path: ${{ runner.temp }}/kiln/
          if-no-files-found: error
          retention-days: 90

  web:
    runs-on: ubuntu-24.04
    container:
      image: ${{ inputs.web-container }}
    timeout-minutes: 60
    outputs:
      built: ${{ steps.find.outputs.built }}
    steps:
      - name: Prepare the container
        if: inputs.web-container != ''
        run: *prepare-container
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Find tool/kiln/build_web.dart
        id: find
        run: |
          if [[ -f tool/kiln/build_web.dart ]]; then built=true; else built=false; fi
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "Web files: $built"
      - if: steps.find.outputs.built == 'true'
        uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@ddf3b51feb64064d8d239ceea60d44e266d32387 # self
      - if: steps.find.outputs.built == 'true'
        run: flutter pub get --no-example
      - name: Set paths
        run: echo "OUT=$RUNNER_TEMP/kiln" >> "$GITHUB_ENV"
      - if: steps.find.outputs.built == 'true'
        uses: Telosnex/telosnex_ci_tools/actions/check-clean-tree@ddf3b51feb64064d8d239ceea60d44e266d32387 # self
      - name: Source key
        if: steps.find.outputs.built == 'true'
        run: |
          mkdir -p "$OUT/key"
          dart run "$PACKAGE:key" --list > "$OUT/key/web.txt"
          tail -1 "$OUT/key/web.txt"
      - name: Build (tool/kiln/build_web.dart)
        if: steps.find.outputs.built == 'true'
        env:
          WEB_CONTAINER: ${{ inputs.web-container }}
        run: |
          mkdir -p "$OUT/web-meta"
          echo "$WEB_RUNNER${WEB_CONTAINER:+, $WEB_CONTAINER}" > "$OUT/web-meta/runner.txt"
          start=$SECONDS
          dart run tool/kiln/build_web.dart \
            --out "$OUT/web" --toolchain-file "$OUT/web-meta/toolchain.txt"
          echo "Web build: $((SECONDS - start)) s"
          if [[ ! -s "$OUT/web-meta/toolchain.txt" ]]; then
            echo "::error::tool/kiln/build_web.dart wrote no --toolchain-file."
            exit 1
          fi
          cat "$OUT/web-meta/toolchain.txt"
      - if: steps.find.outputs.built == 'true'
        uses: Telosnex/telosnex_ci_tools/actions/check-clean-tree@ddf3b51feb64064d8d239ceea60d44e266d32387 # self
      - if: steps.find.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiln-web
          path: ${{ runner.temp }}/kiln/
          if-no-files-found: error
          retention-days: 90

  # The test of the files of the web job (ADR 002 D10, D13).
  web-test:
    needs: web
    if: needs.web.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Find tool/kiln/test_web.dart
        id: find
        run: |
          if [[ -f tool/kiln/test_web.dart ]]; then found=true; else found=false; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [[ $found == false ]]; then
            echo "::warning::The web files have no test: add tool/kiln/test_web.dart."
          fi
      - if: steps.find.outputs.found == 'true'
        uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@ddf3b51feb64064d8d239ceea60d44e266d32387 # self
      - if: steps.find.outputs.found == 'true'
        run: flutter pub get --no-example
      - name: Cache the test files
        if: steps.find.outputs.found == 'true' && inputs.web-test-cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.web-test-cache-path }}
          key: kiln-web-test-${{ hashFiles('tool/kiln/test_web.dart') }}
          restore-keys: kiln-web-test-
      - if: steps.find.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kiln-web
          path: ${{ runner.temp }}/web-artifact
      - name: Install the web files into lib/web
        if: steps.find.outputs.found == 'true'
        run: dart run "$PACKAGE:web" install-dev --from "$RUNNER_TEMP/web-artifact/web"
      - name: Test (tool/kiln/test_web.dart)
        if: steps.find.outputs.found == 'true'
        run: dart run tool/kiln/test_web.dart

  release:
    needs: [build, web, web-test]
    # web-test is skipped for a package without web files.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      needs.web.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.web-test.result) &&
      github.repository_owner == 'Telosnex' &&
      github.actor == 'jpohhhh' && github.triggering_actor == 'jpohhhh'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ inputs.dry-run || github.ref_name == 'kiln-release-dry' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@ddf3b51feb64064d8d239ceea60d44e266d32387 # self
      - run: flutter pub get --no-example
      - run: echo "ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kiln-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Compare the source keys of all runners (I2)
        run: |
          dart run "$PACKAGE:key" --list > "$RUNNER_TEMP/local-key.txt"
          status=0
          for f in "$ARTIFACTS"/key/*.txt; do
            if ! diff -u "$RUNNER_TEMP/local-key.txt" "$f"; then
              echo "::error::The source key on $(basename "$f" .txt) differs."
              status=1
            fi
          done
          exit $status

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command=("$PACKAGE:release")
          if [[ -f tool/kiln/release.dart ]]; then command=(tool/kiln/release.dart); fi
          args=(--staging "$RUNNER_TEMP/staging")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ -d "$ARTIFACTS/web" ]]; then
            args+=(--web "$ARTIFACTS/web"
              --web-runner "$(cat "$ARTIFACTS/web-meta/runner.txt")"
              --web-toolchain "$(cat "$ARTIFACTS/web-meta/toolchain.txt")")
          fi
          echo "dart run ${command[*]} ${args[*]} $ARTIFACTS/out"
          dart run "${command[@]}" "${args[@]}" "$ARTIFACTS/out"
          for f in native_artifacts/prebuilt.json native_artifacts/web.json; do
            if [[ -f "$f" ]]; then cat "$f"; fi
          done

      - name: Push the manifest branch
        if: env.DRY_RUN != 'true'
        run: |
          # Kiln names the tag: native-<16 characters of the source key>.
          tag="native-$(dart run "$PACKAGE:key" | tail -1 | cut -c1-16)"
          branch="kiln-manifest/$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          for f in native_artifacts/prebuilt.json native_artifacts/web.json lib/src/web_runtime.g.dart; do
            if [[ -f "$f" ]]; then git add "$f"; fi
          done
          git commit -m "kiln: manifest of release $tag"
          git push origin "$branch"
          {
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo
            echo "Merge branch \`$branch\` to use it."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          path: native_artifacts/*.json
