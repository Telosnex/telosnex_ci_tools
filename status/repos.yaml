# Notes for `dart run telosnex_ci_tools:repos`. Every entry needs a reason.
#
# followup: repositories the app uses without telosnex_ci_tools (reported
# as Follow-up instead of Missing CI). why: the problem the fork (or our
# package) solves for us; "?" when not known yet. todo: what is left to do.
# The script warns when one is no longer used, or uses telosnex_ci_tools.
#
# upstream: repositories that copy their upstream instead of forking it on
# GitHub (e.g. a package of a monorepo): owner/repo[/path]. The report shows
# it in Fork of, and counts the repository as a fork.
#
# skip: repositories not expected to be a dependency of the app or to use
# telosnex_ci_tools (reported as Skipped instead of Unused). The script warns
# when one turns out to be used, or to use telosnex_ci_tools.
followup:
  - repo: alchemist
    why: >-
      The app has about 1,050 golden tests. Upstream registers a setUp per
      goldenTest call, and every setUp runs before every test (O(N²): 18 GB
      peak RAM, 212 s on 442 tests). Golden images differed between macOS,
      Linux and Windows (blocked-text masks, retained layers). The app's
      Flutter UI comes from the material_ui package.
    todo: >-
      Add CI. Offer upstream: #175 again with the test-body form, and the
      cross-OS fixes. Rebased onto 0.14.1 on 2026-10-28; its smoke tests fail
      on macOS before and after (golden images).
  - repo: archive
    why: >-
      Backups use archive's web codecs, which failed under dart2wasm (raw
      inflate, gzip encode). The archive_40 rename let archive 3 and 4 be
      used side by side; the app uses archive 4 now.
    todo: >-
      Drop the archive_40 rename; make a new fork of upstream with only the
      dart2wasm fix (2026-10-21), and send that fix upstream.
  - repo: auto_updater
    why: >-
      Sparkle updates on macOS. The macOS app builds with Swift Package
      Manager, and pub.dev 1.0.0 has a podspec only. Upstream is about dead:
      no commit since 2025-03, no release since 2024-10, open PRs unreviewed
      (one is SwiftPM, #86).
    todo: Add CI.
  - repo: background_downloader
    why: >-
      Abandoned transfers left partial files of several GB that nothing
      deleted; the app does not resume transfers across launches, so it
      cleans them at launch (cleanUpTempFiles). On Windows, the task
      database was in Roaming AppData, which roaming profiles copy between
      PCs (our policy: per-PC data in Local AppData).
    todo: Add CI. Rebased onto upstream 9.6.4 on 2026-10-28.
  - repo: CamerAwesome
    why: >-
      iOS capture wrote PNG: a multi-second encode per photo; ours writes
      JPEG. The app's Flutter UI comes from material_ui and cupertino_ui.
    todo: >-
      Send the iOS JPEG change upstream. Add CI. Rebased onto upstream on
      2026-10-28.
  - repo: cmark-gfm-dart
    why: Our package; the app's Markdown (GFM) parser.
    todo: Add CI.
  - repo: cmark-gfm-widget
    why: Our package; renders the app's Markdown.
    todo: Add CI.
  - repo: dart-flutter-packages
    why: >-
      In 2026-08 upstream moved MaterialShapes and the shape borders out of
      androidx_graphics_shapes (to material_3p); libmonet's shapes and
      safe-area data need them. Upstream 2.0.0 (pub.dev, 2026-10-15) moved
      them back, so the fork can go.
    todo: >-
      Drop the fork. libmonet: androidx_graphics_shapes ^2.0.0, migrate the
      API (Cubic -> CubicBezier, named CornerRounding, no MutableCubic, the
      material_shapes.dart import), run the AndroidX parity test, regenerate
      the safe-area data with tool/precompute_safe_areas.dart, and review the
      differences.
  - repo: dart-sprintf
    why: >-
      Lua string.format in mods goes through sprintf (lua_dardo_plus); our
      rewrite is about 5x faster. Upstream is dead (no commit since 2022).
    todo: Add CI.
  - repo: dart-vector-tile-renderer
    why: >-
      The maps feature draws the Protomaps light and dark styles with the CPU
      renderer (6.x). Those styles use format and literal expressions and
      text-font, which 6.x does not support.
    todo: >-
      Send the Protomaps change upstream (branch 6.0.0), or move to the GPU
      renderer (upstream main, 7.0). Add CI. Rebased onto 6.1.1 on
      2026-10-28.
  - repo: flutter_lite_camera
    why: >-
      The Flatpak has no /dev/video*: the camera comes through the Camera
      portal and PipeWire. Also: crashes with non-YUYV cameras and before
      the first frame.
    todo: >-
      Send the Linux work upstream (active; 0.2.3 on 2026-09-02). Add CI. Up
      to date with upstream.
  - repo: flutter_local_notifications
    why: >-
      In a Flatpak, notifications must go through the Notification portal;
      upstream's Linux plugin calls the notification server on D-Bus.
    todo: >-
      Send upstream: open issues #1757 and #1987 ask for it. Delete branch
      flatpak-portal (an older copy on upstream master). Add CI. Branch
      flatpak-portal-8.0.2 rebased onto hotfix/22.3.3 on 2026-10-28.
  - repo: flutter_math_fork_fork
    why: >-
      Math in Markdown (cmark-gfm-widget). Upstream does not keep up with
      Flutter: we fixed hashValues, LayoutBuilder (3.32) and
      computeDryBaseline ourselves. Ours also draws negations of any symbol.
      Upstream last merged code in 2025-05; 16 PRs wait unreviewed.
    todo: Add CI.
  - repo: flutter_secure_storage
    why: >-
      In a Snap or Flatpak, reads and writes failed (the host keyring
      answers on D-Bus, but AppArmor blocks it) and users were asked to
      unlock more than once. On web the key was raw bytes in localStorage.
      On Windows the DPAPI file was in Roaming AppData (our policy: per-PC
      data in Local AppData).
    todo: >-
      Send the Linux and web fixes upstream (the Linux fix refines upstream
      #1223). Delete the stale branches (fix/linux-snap-portal-warmup,
      fix/windows-local-appdata, backup/develop-2026-02-10). Add CI.
  - repo: flutter_tts
    why: >-
      Upstream (dlutton) is about dead (last commit 2026-01, 25 open PRs)
      and lacks fixes the app needs: Windows build and crashes, SwiftPM,
      Android AGP 9. Persie0/flutter_tts has them; we mirror it because
      anonymous CI clones of it were refused (pubspec.yaml).
    todo: >-
      An anonymous fetch of Persie0/flutter_tts worked on 2026-10-28: check
      whether the mirror is still needed. Update it when Persie0 moves.
      Delete the import/ and resolve/ branches. Add CI.
  - repo: google_fonts
    why: >-
      The app centres each font's line box (libmonet patchFontLineMetrics,
      ADR_font_line_height D10); google_fonts 9.0.0 passes the bytes to
      FontLoader with no hook. Ours adds GoogleFontsConfig.fontBytesTransform.
    todo: >-
      When google_fonts releases, copy the new version and apply the commit
      again. Offer the hook to flutter/packages. Add CI.
  - repo: highlight.dart
    why: >-
      Code highlighting in Markdown (cmark-gfm-widget). The full registry
      loads the 1C grammar, which crashes iOS Safari; streamed messages need
      highlighting that continues from where it stopped.
    todo: >-
      Upstream master (0.7.1, not on pub.dev) is a new engine:
      highlight_core.dart replaces our limited registry, and continuation
      exists but is private. Move cmark-gfm-widget to it, add a public
      continuation upstream, then drop the fork. Add CI.
  - repo: irondash
    why: >-
      super_native_extensions 0.10 needs irondash_engine_context 0.6 (native
      assets), which pub.dev does not have as a release. Ours adds nil
      guards in the Darwin plugin: a startup race segfaulted on macOS.
    todo: >-
      Send the nil guards upstream (the maintainer is active). Delete branch
      main (an old mirror). Add CI.
  - repo: libmonet
    why: Our package; the app's colour, shape and typography system.
    todo: Add CI. Then androidx_graphics_shapes ^2.0.0 (dart-flutter-packages).
  - repo: LuaDardo
    why: >-
      Mods run Lua; upstream lua_dardo_plus had Lua 5.3 bugs (44 fixed:
      string library and patterns, coroutines, goto, integer math,
      string.pack and dump) and was slow (ours: register hot paths, frame
      loop, closure inlining, scalar-replaced tables). Upstream's GitHub
      repository is gone; it moved to gitlab.com/aa22396584/LuaDardo (login
      to clone). pub.dev 0.3.1 changed only its URLs.
    todo: Add CI. Optionally offer the fixes upstream.
  - repo: packages
    why: >-
      shared_preferences_windows (branch telosnex/sp-windows-local-appdata):
      the file was in Roaming AppData (our policy: per-PC data in Local
      AppData). google_sign_in_web (branch telosnex/defer-gis-sdk): it
      loaded Google's sign-in script when the plugin registered, at every
      web start.
    todo: >-
      Send the google_sign_in_web change upstream. Branch main is an old
      mirror. Add CI. Both rebased onto upstream main on 2026-10-28.
  - repo: pdfrx
    why: >-
      PDF import needs only text, but loadText also builds and sends every
      character's rectangle (slow on web); a stalled PDFium web worker
      blocked every later import.
    todo: >-
      Send upstream (none sent; upstream is active). Add CI. Branch
      telosnex/text-only rebased onto upstream (2.10.1) on 2026-10-28.
  - repo: pixel_snap
    why: >-
      The app's widgets snap to physical pixels (about 1,140 files import
      it). Upstream (widgetbakery, pub.dev 0.1.5) has had no commit since
      2024-02, and its forked Flutter widgets fell behind the SDK. Ours
      follows Flutter (3.38+, the material_ui and cupertino_ui packages) and
      caches PixelSnap.of per subtree: about 1.5% of CPU in streaming chat.
    todo: >-
      Add CI (its tests failed to compile on Flutter 3.47 and nobody saw;
      fixed on 2026-10-28, c1f2025). On a Flutter update, regenerate the
      forked widgets with generator/.
  - repo: receive_sharing_intent
    why: >-
      Sharing files into the app on Android and iOS. Upstream 1.9.0 compiles
      its Android module against SDK 37; Flutter 3.47 and the app compile
      against 36, the SDK that is installed. Ours sets compileSdk 36 (one
      commit; nothing in the plugin needs 37).
    todo: >-
      Drop the fork when the app compiles against SDK 37. Add CI until then.
      Rebased onto upstream master (2 fixes, not on pub.dev yet) on
      2026-10-28.
  - repo: shine_dart
    why: >-
      Our package: a pure Dart MP3 encoder (a port of the Shine C library)
      for saved TTS clips (64 kbit/s mono, 128 kbit/s stereo; telosnex_audio
      ADR R11). Pure Dart runs everywhere, web included, in a squadron
      worker.
    todo: >-
      LGPL 2.0 since 2026-10-28 (it said CC0, but it translates Shine's
      LGPL C code). Fine for the app: its repository will be public, so
      users can rebuild it with a changed shine_dart. Add CI.
  - repo: sqlite3.dart
    why: >-
      OPFS file offsets above 2 GiB wrapped negative, which made healthy
      databases look corrupt. Upstream fixed it in 3.5.2 (#403).
    todo: >-
      Move to sqlite3 3.8 from pub.dev: replace web/sqlite3mc.wasm and
      rebuild web/step_store_worker.dart.js, which fails on main: the worker
      imports Flutter through step_store_chat_functions.dart ->
      chat_tool_text.dart -> loom_reasoning_globals.dart -> loom_step.dart ->
      bucket_id.dart.
  - repo: supabase-flutter
    why: >-
      Sync and sign-in. supabase_flutter (pinned 7b66ba5): startup session
      restoration had no completion to wait for (initialSession is not
      "recovery finished"), and restarted after disposal. realtime_client
      (branch telosnex/realtime-2.17, an override): channels stayed stuck
      after a join error, a sync throw in connect() or transport(), or a
      token change; heartbeats used a stale ref and a stale token; presence
      payloads were mutated; a null old_record crashed deletes.
    todo: >-
      Send the 8 realtime fixes and the restoration completion upstream (none
      sent; 3 of our earlier fixes landed upstream on their own, #1933,
      #1950). Upstream main is rewriting realtime for 3.x (#2030, #2036,
      #2066): recheck each fix there before moving. Both branches are on
      release/supabase_flutter-2.17.x, 0 behind (2026-10-28). Delete the
      merged fix/* branches and the telosnex/*-v2 fallbacks once unneeded.
      Add CI.
  - repo: super_sliver_list
    why: >-
      The chat list. Upstream (pub.dev 0.4.1, 2024-03) has had one commit
      since 2024-07 (CI, 2026-10). Ours (32 commits) adds StickToTarget
      (follow the bottom or an item while content grows), initial positions,
      cancellable header anchoring and reveal, animateToItem returning a
      handle, leak and scroll-correction fixes, and performance work.
    todo: >-
      A fuzzer test fails on our branch before and after the rebase ("Fuzzer
      layout multiple slivers scrolling up", seed 928964062: an extent of
      2571 where 3258 is expected): find out whether it is our bug. Add CI.
      Rebased onto upstream on 2026-10-28 and pinned (it floated on main).
  - repo: universal_html_compat
    why: >-
      HTML parsing for documents and web pages (5 files) in a WebAssembly
      web build. universal_html has dart:html in its import graph, which
      the WebAssembly build reports as blocking (upstream #102, #111, open;
      2.3.0 from 2025-11 still has it). Ours (one 2024 commit) removes
      dart:html and vendors package:html's parser. Not verified on
      2026-10-28 whether upstream 2.3.0 fails a real wasm build.
    todo: >-
      Decide: keep ours, or parse with package:html directly (the app uses
      only parsing.dart and html.dart's DOM). 27 behind upstream (2.3.0
      DOM accessor fixes), not rebased. One dart:html import is left in
      lib/src/_sdk_html_additions.dart (exported by lib/src/_sdk/html.dart):
      check it is not reachable in a wasm build. Add CI.
skip:
  - repo: monet_gdt
    reason: Python training of libmonet's on-device wallpaper model, not a Dart package.
  - repo: telosnex_edge
    reason: The app's Supabase edge functions (TypeScript).
  - repo: telosnex_site
    reason: The public website (TypeScript).
  - repo: minimp3_dart
    reason: embedded in telosnex_audio
  - repo: kiln
    reason: The Kiln tool itself (the app gets it from pub.dev, through Kiln packages).
upstream:
  - repo: google_fonts
    upstream: flutter/packages/packages/google_fonts
