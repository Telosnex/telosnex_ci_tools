# Notes for `dart run telosnex_ci_tools:repos`. Every entry needs a reason.
#
# followup: repositories the app uses without telosnex_ci_tools, with what is
# left to do (reported as Follow-up instead of Missing CI). The script warns
# when one is no longer used, or uses telosnex_ci_tools.
#
# upstream: repositories that copy their upstream instead of forking it on
# GitHub (e.g. a package of a monorepo): owner/repo[/path]. The report shows
# it in Fork of, and counts the repository as a fork.
#
# skip: repositories not expected to be a dependency of the app or to use
# telosnex_ci_tools (reported as Skipped instead of Unused). The script warns
# when one turns out to be used, or to use telosnex_ci_tools.
followup:
  - repo: irondash
    reason: >-
      Keep the fork (irondash_engine_context only): branch telosnex_main is
      upstream main (0.6 native assets, 0 behind) plus one commit, nil
      guards in the Darwin plugin's registry getters (a startup race with
      super_native_extensions segfaulted on macOS). Send upstream: small,
      matches the other platforms, and the maintainer is active (#90,
      2026-08). Delete branch main (an old mirror). Add CI.
  - repo: highlight.dart
    reason: >-
      Branch telosnex/limited-languages (0.7.0 plus 3 commits): a default
      registry of about 50 languages (the 1C grammar crashes iOS Safari),
      parseWithContinuation (incremental highlighting while streaming), and
      flutter_highlight's dependency for cmark-gfm-widget. Not rebased:
      upstream master (0.7.1, 2026-03-30, not on pub.dev) is a new engine
      with a new API (Highlight/hljs, highlight_core.dart for selected
      languages, HighlightResult; +2080/-669 in lib/src). Move
      cmark-gfm-widget to it: highlight_core.dart replaces the limited
      registry; continuation exists but is private (_highlight), so add a
      public form (upstream PR), then drop the fork. Add CI.
  - repo: google_fonts
    reason: >-
      Keep the fork (a copy of google_fonts 9.0.0 from pub.dev, not a GitHub
      fork: upstream is a package of flutter/packages). One commit:
      GoogleFontsConfig.fontBytesTransform, which telosnex uses to centre the
      line box (ADR_font_line_height D10). When google_fonts releases, copy
      the new version and apply the commit again. Could go upstream to
      flutter/packages as a small, general hook. Add CI.
  - repo: flutter_tts
    reason: >-
      Keep the fork: a mirror of Persie0/flutter_tts (identical, 49609539),
      upstream 4.2.5 (dlutton, last commit 2026-01, 25 open PRs) plus about
      20 community PRs: SwiftPM, Windows callback and crash fixes, Android
      KGP and AGP 9, iOS crash fixes. Persie0's repository refuses anonymous
      CI clones, so we mirror it. Update the mirror when Persie0 moves. Delete
      the import/ and resolve/ branches. Add CI.
  - repo: flutter_secure_storage
    reason: >-
      Keep the fork: develop is upstream develop (0 behind) plus 7 commits:
      Linux in Snap/Flatpak (libsecret's backend choice, at most one unlock
      prompt), web (non-extractable CryptoKey in IndexedDB), Windows (the
      DPAPI file in Local AppData). Send the Linux and web fixes upstream
      (active, maintainer reviews; none sent yet); Windows Local AppData is
      our policy. Delete the stale branches (fix/linux-snap-portal-warmup,
      fix/windows-local-appdata, backup/develop-2026-02-10). Add CI.
  - repo: flutter_math_fork_fork
    reason: >-
      Keep the fork; we own it. Upstream (simpleclub/flutter_math, itself a
      fork of the abandoned znjameswu/flutter_math) last merged code in
      2025-05 (Flutter 3.32 support) and last released 0.7.4 on 2025-05-21;
      since then one README merge, and 16 open PRs, the newest unreviewed.
      Ours: computeDryBaseline, material_ui imports, arbitrary negations.
      Add CI.
  - repo: flutter_local_notifications
    reason: >-
      Keep the fork (flutter_local_notifications_linux only): notifications
      through the portal in a Flatpak sandbox. Branch flatpak-portal-8.0.2,
      rebased onto upstream hotfix/22.3.3 on 2026-10-28. Send upstream: open
      issues #1757 and #1987 ask for it. Branch flatpak-portal is an older
      copy on upstream master. Add CI.
  - repo: flutter_lite_camera
    reason: >-
      Keep the fork: the Linux camera through the Camera portal and PipeWire,
      which the Flatpak needs (no /dev/video*), and fixes for non-YUYV
      cameras. Up to date with upstream (0 behind). Send the Linux work
      upstream (active; 0.2.3 on 2026-09-02). Add CI.
  - repo: dart-vector-tile-renderer
    reason: >-
      Keep the fork: Protomaps styles without the GPU renderer (format and
      literal expressions, text-font). Upstream main is the GPU rewrite
      (7.0 beta); the 6.x line is its 6.0.0 branch, our base: rebased onto it
      (6.1.1) on 2026-10-28. Send the Protomaps change upstream to 6.0.0, or
      move to the GPU renderer (vector_map_tiles 10). Add CI.
  - repo: dart-flutter-packages
    reason: >-
      Drop the fork (libmonet only; telosnex gets it through libmonet). Our
      one commit restores MaterialShapes and the shape borders in
      androidx_graphics_shapes; upstream 2.0.0 on pub.dev (2026-10-15) moved
      them back. libmonet: androidx_graphics_shapes ^2.0.0, migrate the API
      (Cubic -> CubicBezier, named CornerRounding, no MutableCubic, the
      material_shapes.dart import), run the AndroidX parity test, regenerate
      the safe-area data with tool/precompute_safe_areas.dart, and review the
      differences.
  - repo: cmark-gfm-dart
    reason: Keep (our package). Add CI.
  - repo: cmark-gfm-widget
    reason: Keep (our package). Add CI.
  - repo: dart-sprintf
    reason: >-
      Keep the fork: a rewrite about 5x faster (lua_dardo_plus uses sprintf
      for Lua string.format), and upstream is dead (no commit since 2022).
      Add CI.
  - repo: CamerAwesome
    reason: >-
      Keep the fork: iOS JPEG capture (not seconds of PNG encoding) and the
      material_ui/cupertino_ui imports. Rebased onto upstream on 2026-10-28.
      Send the iOS JPEG change upstream. Add CI.
  - repo: alchemist
    reason: >-
      Keep the fork (golden setup in the test body, not O(N²) setUps;
      cross-OS golden fixes; material_ui imports). Rebased onto upstream
      0.14.1 on 2026-10-28. Add CI. Its smoke tests fail on macOS before and
      after the rebase (golden images).
  - repo: auto_updater
    reason: >-
      Keep the fork: the macOS app builds with Swift Package Manager and
      upstream (SwiftPM support; pub.dev 1.0.0 is podspec-only) is about
      dead: no commit since 2025-03, no release since 2024-10, open PRs
      unreviewed (one is SwiftPM, #86). Add CI.
  - repo: background_downloader
    reason: >-
      Keep the fork (cleanUpTempFiles, Windows database in Local AppData).
      Rebased onto upstream 9.6.4 on 2026-10-28. Add CI.
  - repo: archive
    reason: >-
      Drop the archive_40 rename (the app already uses archive 4 from
      pub.dev); make a new fork of upstream with only the dart2wasm web codec
      fix (2026-10-21), and send that fix upstream.
  - repo: sqlite3.dart
    reason: >-
      Upstream fixed our OPFS >2 GiB bug in sqlite3 3.5.2. Moving off the fork
      means sqlite3 3.8 plus its sqlite3mc.wasm, and rebuilding
      web/step_store_worker.dart.js, which fails on main: the worker imports
      Flutter through step_store_chat_functions.dart -> chat_tool_text.dart ->
      loom_reasoning_globals.dart -> loom_step.dart -> bucket_id.dart.
skip:
  - repo: monet_gdt
    reason: Python training of libmonet's on-device wallpaper model, not a Dart package.
  - repo: telosnex_edge
    reason: The app's Supabase edge functions (TypeScript).
  - repo: telosnex_site
    reason: The public website (TypeScript).
  - repo: minimp3_dart
    reason: embedded in telosnex_audio
  - repo: kiln
    reason: The Kiln tool itself (the app gets it from pub.dev, through Kiln packages).
upstream:
  - repo: google_fonts
    upstream: flutter/packages/packages/google_fonts
