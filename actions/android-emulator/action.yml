# Boots an x86_64 Android emulator on an x64 Linux runner with KVM
# (ubuntu-24.04). Other runners fail at once: an emulator without KVM, or an
# arm64 image on the arm runner, is too slow for tests.
#
# The emulator keeps running for the later steps of the job. adb is on PATH
# after this action (it is not on ubuntu-24.04). It also caches the Gradle
# distributions of the checkout's example apps, for the later flutter build.
#
# android.dart does the work (README.md). Dart must be on PATH: set up
# Flutter or Dart first. With prepare-only, the action boots nothing; run
# `dart "$tool" run` later for a supervised test run with one retry.
# The action uploads nothing and prints no raw log lines.
name: Android emulator
description: Boots an x86_64 Android emulator with KVM, and puts adb on PATH.

inputs:
  api-level:
    description: The Android API level of the system image.
    required: false
    default: '35'
  target:
    description: The system image target, for example google_apis.
    required: false
    default: google_apis
  device:
    description: The avdmanager device profile.
    required: false
    default: pixel_6
  ram-mb:
    description: The RAM of the emulator. default keeps the value of the AVD.
    required: false
    default: '4096'
  cores:
    description: >-
      The CPU cores of the emulator, 1 to 16. default keeps the value of the
      AVD. Empty: TELOSNEX_ANDROID_EMULATOR_CORES, else 4.
    required: false
    default: ''
  gpu:
    description: The emulator's -gpu mode.
    required: false
    default: swiftshader_indirect
  emulator-args:
    description: More emulator options, split on spaces (for example -feature -Name).
    required: false
    default: ''
  gradle-wrappers:
    description: >-
      Git pathspecs (one per line) of the gradle-wrapper.properties files whose
      Gradle distributions to cache and download first. Empty: none.
    required: false
    default: ':(glob)**/example/**/android/gradle/wrapper/gradle-wrapper.properties'
  boot-timeout-minutes:
    description: Minutes for the boot, with the system image download.
    required: false
    default: '15'
  gdb:
    description: >-
      Start the emulator under GDB, for a backtrace of a crash. Only false
      turns it off. Empty: TELOSNEX_ANDROID_GDB, else true.
    required: false
    default: ''
  adb-trace:
    description: >-
      Trace the host adb server and the emulator's adb (noisy). Only true
      turns it on. Empty: TELOSNEX_ANDROID_ADB_TRACE, else false.
    required: false
    default: ''
  adb-transport:
    description: >-
      emulator (the console serial) or tcp (127.0.0.1:5600, guest adbd over
      an emulator redirect).
    required: false
    default: emulator
  prepare-only:
    description: Install and create the AVD, but boot nothing.
    required: false
    default: 'false'

outputs:
  serial:
    description: The adb serial of the emulator, for flutter -d. Empty with prepare-only.
    value: ${{ steps.boot.outputs.serial }}
  log:
    description: The emulator log file.
    value: ${{ steps.prepare.outputs.session }}/emulator.log
  logcat:
    description: The logcat of the emulator from boot on (the capture keeps writing it).
    value: ${{ steps.prepare.outputs.session }}/logcat.txt
  tool:
    description: The path of android.dart.
    value: ${{ steps.prepare.outputs.tool }}
  session:
    description: The session directory, for the --session of android.dart.
    value: ${{ steps.prepare.outputs.session }}

runs:
  using: composite
  steps:
    # The Gradle wrapper downloads its distribution from GitHub releases with
    # no retry. The distributions are cached, and on a miss downloaded here
    # with retries (gradle_distributions.sh).
    - name: Gradle distributions
      id: gradle
      shell: bash
      env:
        WRAPPERS: ${{ inputs.gradle-wrappers }}
      run: |
        list="$RUNNER_TEMP/gradle-distributions.txt"
        echo "list=$list" >> "$GITHUB_OUTPUT"
        "$GITHUB_ACTION_PATH/gradle_distributions.sh" list "$WRAPPERS" "$list" >> "$GITHUB_OUTPUT"
    - if: steps.gradle.outputs.key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.gradle/wrapper/dists
        key: ${{ steps.gradle.outputs.key }}
    - if: steps.gradle.outputs.key != ''
      name: Download the Gradle distributions
      shell: bash
      env:
        LIST: ${{ steps.gradle.outputs.list }}
      run: '"$GITHUB_ACTION_PATH/gradle_distributions.sh" download "$LIST"'
    - name: Prepare the emulator
      id: prepare
      shell: bash
      env:
        API_LEVEL: ${{ inputs.api-level }}
        TARGET: ${{ inputs.target }}
        DEVICE: ${{ inputs.device }}
        RAM_MB: ${{ inputs.ram-mb }}
        CORES: ${{ inputs.cores }}
        GPU: ${{ inputs.gpu }}
        EMULATOR_ARGS: ${{ inputs.emulator-args }}
        BOOT_TIMEOUT_MINUTES: ${{ inputs.boot-timeout-minutes }}
        GDB: ${{ inputs.gdb }}
        ADB_TRACE: ${{ inputs.adb-trace }}
        ADB_TRANSPORT: ${{ inputs.adb-transport }}
      run: |
        if ! command -v dart > /dev/null; then
          echo "::error::android-emulator needs Dart on PATH. Set up Flutter or Dart first."
          exit 1
        fi
        tool="$GITHUB_ACTION_PATH/android.dart"
        session="$RUNNER_TEMP/android-emulator"
        echo "tool=$tool" >> "$GITHUB_OUTPUT"
        echo "session=$session" >> "$GITHUB_OUTPUT"
        dart "$tool" prepare --session "$session" \
          --api-level "$API_LEVEL" --target "$TARGET" --device "$DEVICE" \
          --ram-mb "$RAM_MB" --cores "$CORES" --gpu "$GPU" \
          --emulator-args "$EMULATOR_ARGS" \
          --boot-timeout-minutes "$BOOT_TIMEOUT_MINUTES" \
          --gdb "$GDB" --adb-trace "$ADB_TRACE" --adb-transport "$ADB_TRANSPORT"
    - name: Boot the emulator
      id: boot
      if: inputs.prepare-only != 'true'
      shell: bash
      env:
        TOOL: ${{ steps.prepare.outputs.tool }}
        SESSION: ${{ steps.prepare.outputs.session }}
        API_LEVEL: ${{ inputs.api-level }}
      run: |
        start=$(date +%s)
        dart "$TOOL" boot --session "$SESSION"
        echo "Android $API_LEVEL emulator booted after $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
