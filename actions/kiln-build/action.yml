name: Build the prebuilt files of a target
description: >-
  Describes the toolchain, then runs `dart run <package>:build` for one
  target. The files go to <out>/out/<target>.

inputs:
  package:
    description: The Dart package of kiln. native_prebuilt before its rename.
    required: false
    default: kiln
  target:
    description: A target, for example windows-x64.
    required: true
  runner:
    description: The runner label. It goes into target.json.
    required: true
  out:
    description: The output directory.
    required: true
  ndk-version:
    description: The Android NDK version, for the toolchain description.
    required: false
    default: ''
  build-args:
    description: >-
      JSON. A target pattern (`*` matches any text) to a list of more
      arguments for the build command. ${NAME} in an argument expands to
      the environment variable NAME.
    required: false
    default: '{}'
  toolchain-extra:
    description: >-
      JSON. A target pattern to a text that the action adds to the toolchain
      description. ${NAME} expands as in build-args.
    required: false
    default: '{}'

outputs:
  toolchain:
    description: The toolchain description in target.json.
    value: ${{ steps.build.outputs.toolchain }}

runs:
  using: composite
  steps:
    - name: Build
      id: build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        TARGET: ${{ inputs.target }}
        RUNNER: ${{ inputs.runner }}
        OUT: ${{ inputs.out }}
        NDK_VERSION: ${{ inputs.ndk-version }}
        BUILD_ARGS: ${{ inputs.build-args }}
        TOOLCHAIN_EXTRA: ${{ inputs.toolchain-extra }}
      # The script uses only dart:io and dart:convert, so it needs no pub get.
      run: dart "$GITHUB_ACTION_PATH/kiln_build.dart"
