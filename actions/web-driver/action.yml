# Starts the WebDriver server of a stock browser on a GitHub-hosted runner,
# for `flutter drive -d web-server --browser-name <browser>`:
# chromedriver and geckodriver (Linux), safaridriver (macOS). ios-safari is
# Safari in a booted iOS simulator, through the same safaridriver.
# android-chrome is Chrome on a running Android emulator (adb on PATH): the
# chromedriver of its milestone comes from Chrome for Testing. Run flutter
# drive with --no-android-emulator and a fixed --web-port, and forward the
# port with `adb reverse` (the page must stay on localhost, the same origin).
#
# ios-safari opens Safari once in the simulator first: its first launch on a
# fresh simulator is slow (18-90 s), and safaridriver can time out finding
# it. Boot the simulator with ios-simulator-boot (macos-26 or newer).
#
# With `run`, it also runs that command (flutter drive) with a watchdog, and
# runs it again, up to 3 times, only when the driver could not start a
# browser session (safaridriver sometimes times out launching Safari). The
# app never ran then. Other failures are final, except one: when the run
# printed "All tests passed." and only closing the browser session failed
# afterwards (an adb timeout on Android), it passes with a warning.
#
# "All tests passed." from flutter drive is not enough on its own:
# integrationDriver reports only IntegrationTestWidgetsFlutterBinding.results,
# which gets failures from testWidgets' exception reporter only. A plain
# test() that fails or times out, or a failing setUp/tearDown, is reported as
# passing. And flutter drive prints nothing of the browser console. Use
# packages/telosnex_web_test of this repository: installWebTestSupport in the
# app reports every test's result and keeps the console, and its driver
# (webIntegrationDriver) saves the console while the tests run.
#
# Logs, in a new directory in $RUNNER_TEMP per use (the output `logs`),
# uploaded as an artifact (`upload`; give each use in a job its own
# `artifact-name` and `port`): driver.log (chromedriver, geckodriver or
# safaridriver), run_<attempt>.log (the output of `run`), and from
# webIntegrationDriver, web_console.log and integration_response_data.json:
# `run` gets their paths in TELOSNEX_WEB_TEST_CONSOLE and
# TELOSNEX_WEB_TEST_RESPONSE, which the driver reads.
name: Web driver
description: Starts chromedriver, geckodriver or safaridriver, and runs flutter drive.

inputs:
  browser:
    description: chrome, firefox, safari, ios-safari (boot a simulator first) or android-chrome (start an emulator first).
    required: true
  port:
    description: The driver port. flutter drive uses 4444.
    required: false
    default: '4444'
  run:
    description: >-
      Optional. A bash script that runs flutter drive. Empty: only start the
      driver.
    required: false
    default: ''
  idle-minutes:
    description: Minutes without output before `run` is stopped.
    required: false
    default: '10'
  working-directory:
    description: The directory of `run`.
    required: false
    default: '.'
  require-result:
    description: >-
      Optional. A jq expression that must be true of
      integration_response_data.json after `run` passed, e.g.
      '.telosnexWebTestSummary.passed >= 12' or '.web.last_case.done':
      a run that skipped the tests fails.
    required: false
    default: ''
  upload:
    description: When to upload the logs as an artifact, always, failure or never.
    required: false
    default: always
  artifact-name:
    description: >-
      The artifact name. Empty: web-driver-<job id>-<matrix job index>.
    required: false
    default: ''

outputs:
  port:
    description: The driver port.
    value: ${{ inputs.port }}
  logs:
    description: The log directory.
    value: ${{ steps.start.outputs.logs }}

runs:
  using: composite
  steps:
    - name: Start the driver
      id: start
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        PORT: ${{ inputs.port }}
        UPLOAD: ${{ inputs.upload }}
      run: |
        case "$UPLOAD" in
          always|failure|never) ;;
          *) echo "::error::upload must be always, failure or never, not $UPLOAD."; exit 1 ;;
        esac
        logs=$(mktemp -d "$RUNNER_TEMP/web-driver.XXXXXX")
        echo "logs=$logs" >> "$GITHUB_OUTPUT"
        log="$logs/driver.log"
        case "$BROWSER" in
          chrome)
            version="$(google-chrome --version), $("$CHROMEWEBDRIVER/chromedriver" --version)"
            "$CHROMEWEBDRIVER/chromedriver" --port="$PORT" > "$log" 2>&1 & ;;
          firefox)
            version="$(firefox --version), $("$GECKOWEBDRIVER/geckodriver" --version | awk 'NR == 1')"
            "$GECKOWEBDRIVER/geckodriver" --port "$PORT" > "$log" 2>&1 & ;;
          safari|ios-safari)
            version="Safari $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist)"
            if [[ "$BROWSER" == ios-safari ]]; then
              version="$version, simulator $(xcrun simctl list devices booted | awk '/\(Booted\)/ && !found { sub(/^ +/, ""); print; found = 1 } END { if (!found) print "none booted" }')"
            fi
            if [[ "$BROWSER" == ios-safari ]]; then
              # Runs "$@" with a limit of $1 seconds (macOS has no timeout(1)).
              limit() { local s=$1; shift; "$@" & local p=$!; ( sleep "$s"; kill "$p" 2> /dev/null ) & local w=$!; local rc=0; wait "$p" || rc=$?; kill "$w" 2> /dev/null || true; return "$rc"; }
              start=$(date +%s)
              if limit 300 xcrun simctl launch booted com.apple.mobilesafari > /dev/null; then
                echo "Safari's first launch: $(( $(date +%s) - start )) s"
                sleep 20
              else
                echo "::warning::Safari did not launch in 300 s; safaridriver will try."
              fi
              xcrun simctl terminate booted com.apple.mobilesafari 2> /dev/null || true
            fi
            sudo safaridriver --enable
            safaridriver --port "$PORT" > "$log" 2>&1 & ;;
          android-chrome)
            # awk reads to the end: an early exit (grep -m1) breaks the pipe under pipefail.
            device_chrome=$(adb shell dumpsys package com.android.chrome | awk -F= '/versionName=/ && !v { v = $2; sub(/\r$/, "", v) } END { print v }')
            if [[ -z "$device_chrome" ]]; then
              echo "::error::The emulator has no com.android.chrome."
              exit 1
            fi
            milestone=${device_chrome%%.*}
            url=$(curl -sf https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json |
              jq -r --arg m "$milestone" '.milestones[$m].downloads.chromedriver[] | select(.platform == "linux64") | .url')
            if [[ -z "$url" ]]; then
              echo "::error::Chrome for Testing has no chromedriver for Chrome $milestone."
              exit 1
            fi
            curl -sfL -o "$RUNNER_TEMP/chromedriver.zip" "$url"
            unzip -qo "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP/chromedriver"
            driver="$RUNNER_TEMP/chromedriver/chromedriver-linux64/chromedriver"
            # No first-run screens: they would cover the page.
            adb shell 'echo "chrome --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
            version="Chrome $device_chrome (emulator), $("$driver" --version)"
            "$driver" --port="$PORT" > "$log" 2>&1 & ;;
          *)
            echo "::error::browser must be chrome, firefox, safari, ios-safari or android-chrome, not $BROWSER."
            exit 1 ;;
        esac
        for _ in $(seq 1 30); do
          curl -sf "http://127.0.0.1:$PORT/status" > /dev/null && break
          sleep 1
        done
        if ! curl -sf "http://127.0.0.1:$PORT/status"; then
          echo "::error::The $BROWSER driver did not start."
          cat "$log"
          exit 1
        fi
        echo
        echo "$BROWSER: $version" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Run
      if: inputs.run != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSER: ${{ inputs.browser }}
        WATCH_RUN: ${{ inputs.run }}
        WATCH_IDLE_MINUTES: ${{ inputs.idle-minutes }}
        REQUIRE_RESULT: ${{ inputs.require-result }}
        LOGS: ${{ steps.start.outputs.logs }}
      run: |
        export TELOSNEX_WEB_TEST_CONSOLE="$LOGS/web_console.log"
        export TELOSNEX_WEB_TEST_RESPONSE="$LOGS/integration_response_data.json"
        # On Windows: Git\bin\bash.exe, the bash of GitHub's steps ("bash"
        # from cmd can be WSL's), and dart.exe itself. Flutter's `dart`
        # wrapper (bin/dart, then dart.bat) leaves OS=MINGW64... and its
        # cmd variables in the environment, and every flutter that watch then
        # started failed: "bash: C:Usersjpodevflutter/bin/internal/
        # exit_with_errorlevel.bat" (reproduced in a Windows 11 VM).
        bash_exe=bash
        dart_exe=dart
        if [[ "$RUNNER_OS" == Windows ]]; then
          git_root=$(cygpath -m /)
          bash_exe="${git_root%/}/bin/bash.exe"
          sdk_dart="$(dirname "$(command -v dart)")/cache/dart-sdk/bin/dart.exe"
          if [[ -f "$sdk_dart" ]]; then dart_exe=$sdk_dart; fi
        fi
        for attempt in 1 2 3; do
          out="$LOGS/run_$attempt.log"
          status=0
          "$dart_exe" "$GITHUB_ACTION_PATH/../watch/watch.dart" --idle "$(( WATCH_IDLE_MINUTES * 60 ))" \
            -- "$bash_exe" -eo pipefail -c "$WATCH_RUN" 2>&1 | tee "$out" || status=$?
          grep -q "SessionNotCreatedException" "$out" || break
          echo "::warning::$BROWSER: the driver could not start a session (attempt $attempt)"
          sleep 10
        done
        if [[ "$status" != 0 ]] && grep -q '^All tests passed\.' "$out" &&
          grep -qE 'parseDeleteSessionResponse|WebDriver\.quit' "$out"; then
          echo "::warning::$BROWSER: all tests passed; only closing the browser session failed."
          status=0
        fi
        if [[ "$status" == 0 && -n "$REQUIRE_RESULT" ]]; then
          if [[ ! -f "$TELOSNEX_WEB_TEST_RESPONSE" ]]; then
            echo "::error::$BROWSER: no $TELOSNEX_WEB_TEST_RESPONSE for require-result. Use webIntegrationDriver of telosnex_web_test."
            status=1
          elif ! jq -e "$REQUIRE_RESULT" "$TELOSNEX_WEB_TEST_RESPONSE" > /dev/null; then
            echo "::error::$BROWSER: the run passed, but the response data fails require-result: $REQUIRE_RESULT"
            status=1
          fi
        fi
        exit "$status"
    - name: Upload the logs
      if: always() && (inputs.upload == 'always' || (inputs.upload == 'failure' && failure()))
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name || format('web-driver-{0}-{1}', github.job, strategy.job-index) }}
        path: ${{ steps.start.outputs.logs }}
        if-no-files-found: ignore
        # A re-run of the job replaces the logs of its first attempt.
        overwrite: true
