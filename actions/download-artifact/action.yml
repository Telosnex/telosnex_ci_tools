# actions/download-artifact with one more try. It already retries 5 times
# within a few seconds, which doesn't outlast a short GitHub storage outage
# (fllama_cpp, 2026-10-30 14:15 UTC). This waits a minute and tries again.
name: Download artifact
description: actions/download-artifact, retried once after a minute.

inputs:
  name:
    description: The artifact to download. Empty with `pattern`, or for all.
    required: false
    default: ''
  pattern:
    description: A glob of artifact names, instead of `name`.
    required: false
    default: ''
  path:
    description: Where to put the files.
    required: false
    default: ''
  merge-multiple:
    description: With several artifacts, put all their files in `path`.
    required: false
    default: 'false'
  retry-seconds:
    description: Seconds to wait before the second try.
    required: false
    default: '60'

runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
    - if: steps.first.outcome == 'failure'
      shell: bash
      env:
        RETRY_SECONDS: ${{ inputs.retry-seconds }}
      run: |
        echo "::warning::Artifact download failed; trying again in ${RETRY_SECONDS} s."
        sleep "$RETRY_SECONDS"
    - if: steps.first.outcome == 'failure'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
