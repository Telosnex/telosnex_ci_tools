# `dart test -p <browser> -c <compiler>` on a GitHub runner:
# - firefox on Linux runs under xvfb-run (Firefox needs a display; package:test
#   starts it without --headless);
# - safari (macOS) opens the test page through safari_launcher.sh (set with
#   DART_TEST_CONFIG; a package's own dart_test.yaml override wins). Without
#   it, package:test opens a local redirect.html, and Safari asks the user to
#   confirm the file: the run waits forever. Needs package:test < 1.33: 1.33
#   drives Safari through safaridriver instead, runs the launcher as
#   safaridriver (exit 64), and without the launcher hung at "loading".
# - chrome needs nothing.
name: dart test browser
description: dart test -p chrome|firefox|safari on a runner, with what each browser needs.

inputs:
  platform:
    description: chrome, firefox or safari.
    required: true
  compiler:
    description: dart2js or dart2wasm.
    required: false
    default: dart2js
  args:
    description: More dart test arguments (files, -j 1, --exclude-tags ...), one line.
    required: false
    default: ''
  working-directory:
    description: The package directory.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLATFORM: ${{ inputs.platform }}
        COMPILER: ${{ inputs.compiler }}
        ARGS: ${{ inputs.args }}
      run: |
        read -r -a extra <<< "$ARGS"
        run=(dart test -p "$PLATFORM" -c "$COMPILER" -r expanded "${extra[@]}")
        case "$PLATFORM-$RUNNER_OS" in
          firefox-Linux)
            if ! command -v xvfb-run > /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq xvfb > /dev/null
            fi
            run=(xvfb-run -a "${run[@]}")
            ;;
          safari-macOS)
            config="$RUNNER_TEMP/dart_test_global.yaml"
            printf 'override_platforms:\n  safari:\n    settings:\n      executable: /bin/bash\n      arguments: %s\n' \
              "$GITHUB_ACTION_PATH/safari_launcher.sh" > "$config"
            export DART_TEST_CONFIG="$config"
            ;;
        esac
        echo "+ ${run[*]}"
        "${run[@]}"
