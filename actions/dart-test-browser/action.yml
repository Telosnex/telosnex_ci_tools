# `dart test -p <browser> -c <compiler>` on a GitHub runner:
# - firefox on Linux runs under xvfb-run (Firefox needs a display; package:test
#   starts it without --headless);
# - safari (macOS) enables safaridriver: package:test 1.33 and newer drive
#   Safari through it. Older package:test opened a local redirect.html that
#   Safari refuses without a prompt; use 1.33+, and remove override_platforms
#   Safari launchers (1.33 runs them as safaridriver, and they exit 64).
# - chrome needs nothing.
name: dart test browser
description: dart test -p chrome|firefox|safari on a runner, with what each browser needs.

inputs:
  platform:
    description: chrome, firefox or safari.
    required: true
  compiler:
    description: dart2js or dart2wasm.
    required: false
    default: dart2js
  args:
    description: More dart test arguments (files, -j 1, --exclude-tags ...), one line.
    required: false
    default: ''
  working-directory:
    description: The package directory.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLATFORM: ${{ inputs.platform }}
        COMPILER: ${{ inputs.compiler }}
        ARGS: ${{ inputs.args }}
      run: |
        read -r -a extra <<< "$ARGS"
        run=(dart test -p "$PLATFORM" -c "$COMPILER" -r expanded "${extra[@]}")
        case "$PLATFORM-$RUNNER_OS" in
          firefox-Linux)
            if ! command -v xvfb-run > /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq xvfb > /dev/null
            fi
            run=(xvfb-run -a "${run[@]}")
            ;;
          safari-macOS)
            sudo safaridriver --enable
            ;;
        esac
        echo "+ ${run[*]}"
        "${run[@]}"
