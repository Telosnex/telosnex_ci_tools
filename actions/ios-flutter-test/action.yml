# Runs `flutter test <target> -d <simulator>` for native iOS app tests, on
# fresh simulators (ios-simulator-boot's boot.dart), with:
#
# - a connect watchdog: sometimes the app starts and its VM service listens,
#   but flutter test never connects (its `simctl spawn log stream` misses
#   the "Dart VM service is listening" line). An attempt with no VM service
#   `connect-seconds` after "Waiting for VM Service port" ends;
# - a stall watchdog (actions/watch): no output for `idle-minutes` ends the
#   attempt, with a screenshot and the installed apps;
# - retries: up to `attempts`, each on a new simulator, only while no test
#   has started. Once a test has started, a failure is final.
#
# Diagnostics in $RUNNER_TEMP/ios-flutter-test (simulator log stream, test
# output, screenshots); upload them with if: always().
#
# Build the app first (flutter build ios --simulator --debug -t <target>,
# same defines): the Xcode build is silent for minutes, and built ahead, the
# build in flutter test is incremental. Does not start Safari.
name: iOS flutter test
description: flutter test on a fresh iOS simulator, with a connect watchdog and retries.

inputs:
  target:
    description: The test file, e.g. integration_test/app_test.dart.
    required: true
  args:
    description: More flutter test arguments (e.g. --dart-define=...), one line.
    required: false
    default: ''
  working-directory:
    description: The Flutter app directory.
    required: false
    default: '.'
  attempts:
    description: Attempts while no test has started.
    required: false
    default: '3'
  connect-seconds:
    description: Seconds to wait for the VM service after the app launch.
    required: false
    default: '150'
  missed-line-seconds:
    description: >-
      Seconds flutter test gets to report the VM service after the app has
      logged it (in our own simulator log stream). flutter_tools sometimes
      never receives that line; then the attempt ends after this instead of
      connect-seconds.
    required: false
    default: '30'
  idle-minutes:
    description: Minutes without output before an attempt is stopped.
    required: false
    default: '8'

runs:
  using: composite
  steps:
    - name: flutter test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGET: ${{ inputs.target }}
        ARGS: ${{ inputs.args }}
        ATTEMPTS: ${{ inputs.attempts }}
        CONNECT_SECONDS: ${{ inputs.connect-seconds }}
        MISSED_LINE_SECONDS: ${{ inputs.missed-line-seconds }}
        IDLE_MINUTES: ${{ inputs.idle-minutes }}
      run: |
        # Runs "$@" with a limit of $1 seconds (macOS has no timeout(1)).
        limit() { local s=$1; shift; "$@" & local p=$!; ( sleep "$s"; kill "$p" 2> /dev/null ) & local w=$!; local rc=0; wait "$p" || rc=$?; kill "$w" 2> /dev/null || true; return "$rc"; }
        tools="$GITHUB_ACTION_PATH/.."
        diag="$RUNNER_TEMP/ios-flutter-test"
        mkdir -p "$diag"
        read -r -a extra <<< "$ARGS"
        limit 300 xcrun simctl list runtimes > /dev/null
        status=1
        for (( attempt = 1; attempt <= ATTEMPTS; attempt++ )); do
          udid=$(dart "$tools/ios-simulator-boot/boot.dart" --fresh)
          xcrun simctl spawn "$udid" log stream --level debug --style compact \
            --predicate 'process == "Runner" OR process == "installd" OR process == "SpringBoard"' \
            > "$diag/simulator_$attempt.log" 2>&1 &
          logger=$!
          out="$diag/test_$attempt.log"
          status=0
          # -v: the VM-service lines the watchdog reads. Its "[ +12 ms]"
          # prefixes do not count as output. A subshell, so wait gets the
          # status of the pipeline (pipefail).
          (
            set -o pipefail
            dart "$tools/watch/watch.dart" --idle "$(( IDLE_MINUTES * 60 ))" --ignore '^\[ *\+ *[0-9]+ ms\]' \
              --on-stall "xcrun simctl listapps $udid > $diag/apps_$attempt.txt 2>&1; xcrun simctl io $udid screenshot $diag/screen_$attempt.png" \
              -- flutter test -v "$TARGET" -d "$udid" -r expanded "${extra[@]}" 2>&1 | tee "$out"
          ) &
          pipeline=$!
          (
            waited=0
            # Seconds since the app logged its VM service (our log stream)
            # while flutter test has not reported it: flutter_tools' own
            # simulator log reader sometimes never delivers that line (it
            # starts after simctl launch), and then flutter waits forever.
            missed=-1
            while kill -0 "$pipeline" 2> /dev/null; do
              if grep -q 'VM Service URL on device' "$out" 2> /dev/null; then exit 0; fi
              if grep -q 'Waiting for VM Service port' "$out" 2> /dev/null; then
                waited=$(( waited + 5 ))
                if (( missed < 0 )) && grep -q 'Dart VM service is listening' "$diag/simulator_$attempt.log" 2> /dev/null; then
                  missed=0
                elif (( missed >= 0 )); then
                  missed=$(( missed + 5 ))
                fi
                reason=
                if (( missed >= MISSED_LINE_SECONDS )); then
                  reason="the app logged its VM service but flutter test did not see it in $MISSED_LINE_SECONDS s"
                elif (( waited >= CONNECT_SECONDS )); then
                  reason="no VM service $CONNECT_SECONDS s after launch"
                fi
                if [[ -n "$reason" ]]; then
                  echo "::warning::Attempt $attempt: $reason; ending the attempt."
                  {
                    echo "== $reason"
                    echo "== log stream processes"; pgrep -fl 'log stream' || true
                    echo "== VM service lines in our simulator log (simulator_$attempt.log)"
                    grep 'Dart VM service is listening' "$diag/simulator_$attempt.log" | tail -5
                  } > "$diag/connect_$attempt.txt" 2>&1
                  # flutter_tools and watch.dart both have this in their command line.
                  pkill -f -- "-d $udid" || true
                  exit 0
                fi
              fi
              sleep 5
            done
          ) &
          wait "$pipeline" || status=$?
          kill "$logger" 2> /dev/null || true
          echo "Attempt $attempt: exit $status" | tee -a "$GITHUB_STEP_SUMMARY"
          started=0
          # "00:00 +0: loading <file>" is printed before the app connects.
          if grep -E '^[0-9]{2}:[0-9]{2} \+[0-9]+' "$out" | grep -qv ': loading '; then started=1; fi
          xcrun simctl shutdown "$udid" || true
          xcrun simctl delete "$udid" || true
          if (( started )) || [[ "$status" == 0 ]]; then break; fi
        done
        exit "$status"
