# Lets `dart test -p safari` run on a macOS runner. package:test 1.33 and
# newer drive Safari through safaridriver, which needs remote automation
# enabled once (sudo). Older package:test opened a local redirect.html that
# Safari refuses without a prompt; packages carried an override_platforms
# launcher for that. Remove such an override: package:test 1.33 runs the
# override's executable as safaridriver (`--port N`), and it exits 64.
name: dart test Safari
description: Enables safaridriver for `dart test -p safari` (package:test 1.33 or newer).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo safaridriver --enable
        safaridriver --version
